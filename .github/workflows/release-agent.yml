name: release-agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Prepare dist directory
        run: mkdir -p dist
      - name: Set up QEMU (multi-arch for docker)
        uses: docker/setup-qemu-action@v3
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm msitools wixl genisoimage zip unzip pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev
      - name: Set up Docker Buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Generate release notes with AI prompt
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: changelog --config .goreleaser.yaml --output release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser (linux artifacts only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean --split --parallelism 2 --skip=homebrew --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GGOOS: linux
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist
          retention-days: 3


  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Prepare dist directory
        run: mkdir -p dist
      - name: Generate release notes with AI prompt
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: changelog --config .goreleaser.yaml --output release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run GoReleaser (macOS agent + GUI/TUI)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean --split --parallelism 2 --single-target --skip=docker --skip=nfpm --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GGOOS: darwin
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist
          retention-days: 3


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Prepare dist directory
        run: |
          if (-Not (Test-Path dist)) { New-Item -ItemType Directory -Path dist | Out-Null }
      - name: Generate release notes with AI prompt
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: changelog --config .goreleaser.yaml --output release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run GoReleaser (Windows agent + GUI/TUI)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean --split --parallelism 2 --single-target --skip=docker --skip=nfpm --skip=homebrew --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GGOOS: windows
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist
          retention-days: 3


  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Set up Docker Buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Download macOS dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist
      - name: Download Windows dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist
      - name: Regenerate release notes for merge
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: changelog --config .goreleaser.yaml --output release-notes.md
      - name: Merge and publish release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: continue --merge

  docker:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Set up QEMU (multi-arch for docker)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser (docker only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: >-
            release --clean --parallelism 1 --single-target
            --skip=announce
            --skip=archive
            --skip=nfpm
            --skip=homebrew
            --skip=sbom
            --skip=sign
            --skip=dmg
            --skip=msi
            --skip=winget
            --skip=aur
            --skip=aur-source
            --skip=fury
            --skip=npm
            --skip=snapcraft
            --skip=scoop
            --skip=cloudsmith
            --skip=ko
            --skip=nix
            --skip=makeself
            --skip=mcp
            --skip=report-sizes
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GGOOS: linux
