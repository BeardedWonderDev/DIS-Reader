name: release-agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#refs/tags/}"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$VERSION" --title "$VERSION" --notes "Automated release for $VERSION" $PRERELEASE_FLAG || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm msitools wixl genisoimage zip unzip
          which wixl

      - name: Set up Docker Buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser Pro
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Build macOS pkg artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#refs/tags/}"
          for arch in amd64 arm64; do
            ARCH=$arch VERSION=$VERSION packaging/macos/pkgbuild.sh
          done

      - name: Upload macOS pkg to release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#refs/tags/}"
          shopt -s nullglob
          PKGS=(dist/dis-agent-darwin-*.pkg)
          if (( ${#PKGS[@]} )); then
            gh release upload "$VERSION" "${PKGS[@]}" --clobber
          else
            echo "No macOS pkg files to upload; skipping."
          fi
