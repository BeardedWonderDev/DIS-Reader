name: release-agent

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install nfpm
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_x86_64.tar.gz | tar -xz nfpm
          sudo mv nfpm /usr/local/bin/nfpm
      - name: Build & package
        run: make release-agent VERSION=${{ github.sha }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dis-agent-artifacts
          path: dist/*
