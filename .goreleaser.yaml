# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: dis-agent

before:
  hooks:
    - go mod download

builds:
  - id: agent
    main: ./cmd/agent
    binary: dis-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archives
    ids:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - packaging/examples/agent.yaml
      - packaging/examples/bridge_agents.yaml
      - packaging/windows/install_service.ps1
      - packaging/windows/uninstall_service.ps1
      - packaging/launchd/com.dis.agent.plist

nfpms:
  - id: linux
    package_name: dis-agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    maintainer: "DIS Reader Team <maintainer@example.com>"
    description: "DIS remote bridge agent (AS/400 JDBC bridge helper)."
    homepage: "https://github.com/BeardedWonderDev/DIS-Reader"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: packaging/examples/agent.yaml
        dst: /etc/dis-agent/agent.yaml
        type: config|noreplace
      - src: packaging/examples/bridge_agents.yaml
        dst: /etc/dis-agent/bridge_agents.yaml
        type: config|noreplace
      - src: packaging/systemd/dis-agent.service
        dst: /lib/systemd/system/dis-agent.service
        type: config|noreplace

msi:
  - id: windows-msi
    name: "dis-agent-{{ .MsiArch }}"
    wxs: packaging/windows/agent.wxs
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"

homebrew_casks:
  - name: dis-agent
    ids:
      - archives
    url:
      template: "https://github.com/BeardedWonderDev/DIS-Reader/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/BeardedWonderDev/DIS-Reader"
    description: "DIS remote bridge agent (headless)."
    license: "Apache-2.0"
    binaries:
      - dis-agent
    repository:
      owner: BeardedWonderDev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    skip_upload: true

dockers_v2:
  - id: dis-agent
    images:
      - ghcr.io/beardedwonderdev/dis-agent
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: packaging/docker/Dockerfile

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  replace_existing_draft: true
  prerelease: auto
  mode: replace

changelog:
  use: github
  ai:
    use: openai
    prompt: |
      Write the release notes for this release.

      ## Instructions:

      - do not use emojis
      - write short summary featuring user-impacting changes.
      - provide a commit history and overview of each commit or set of related commits broken down and group by the following categories
        - Added: for new features.
        - Changed: for changes in existing functionality.
        - Deprecated: for soon-to-be removed features.
        - Removed: for now removed features.
        - Fixed: for any bug fixes.
        - Security: in case of vulnerabilities.
      - if many commits update the same dependency, make sure to group them in a single line, for instance: 'sha-commit-1, sha-commit-2: updated dependency-x from v1.0.0 to v1.4.0'. Make sure to include the original version and the latest version being used.
      - respond ONLY THE GENERATED RELEASE NOTES, NOTHING ELSE.
      - format the response as a markdown
      - do not change the original commit messages

      ## Some details about this release:

      Project name: {{.ProjectName}}
      Git repository URL: {{.GitURL}}
      {{ if eq .Tag "" }}
      Previous version: {{.Version}}
      Version: to be defined
      {{ else }}
      Previous Version: {{.PreviousTag}}
      Version: {{.Tag}}
      {{ end }}
      {{ if .IsSnapshot }}This is a snapshot build.{{ end }}
      {{ if .IsNightly }}This is a nightly build.{{ end }}
      {{ with .TagSubject }}Tag subject: {{ . }}{{ end }}
      {{ with .TagContents }}Tag content: {{ . }}{{ end }}

      ## Release notes:

      {{ .ReleaseNotes }}
