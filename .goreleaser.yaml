# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: dis-agent

partial:
  # Run releases in split/merge mode keyed by GOOS so per-OS jobs can
  # build independently and a final job can merge/publish once.
  by: goos

before:
  hooks:
    - go mod download

builds:
  - id: agent-linux
    main: ./cmd/agent
    binary: dis-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agent-darwin
    main: ./cmd/agent
    binary: dis-agent
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agent-windows
    main: ./cmd/agent
    binary: dis-agent
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agentctl-linux
    main: ./cmd/agentctl
    binary: agentctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agentctl-darwin
    main: ./cmd/agentctl
    binary: agentctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agentctl-windows
    main: ./cmd/agentctl
    binary: agentctl
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: agent-gui-linux
    main: ./cmd/agentgui
    binary: dis-agent-gui
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
      - -tags=gui
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agent-gui-darwin
    main: ./cmd/agentgui
    binary: dis-agent-gui
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -tags=gui
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agent-gui-windows
    main: ./cmd/agentgui
    binary: dis-agent-gui
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -tags=gui
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archives-linux
    ids:
      - agent-linux
      - agentctl-linux
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - packaging/examples/agent.yaml
      - packaging/examples/bridge_agents.yaml
      - packaging/windows/install_service.ps1
      - packaging/windows/uninstall_service.ps1
      - packaging/launchd/com.dis.agent.plist

  - id: archives-darwin
    ids:
      - agent-darwin
      - agentctl-darwin
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - packaging/examples/agent.yaml
      - packaging/examples/bridge_agents.yaml
      - packaging/launchd/com.dis.agent.plist

  - id: archives-windows
    ids:
      - agent-windows
      - agentctl-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - LICENSE
      - README.md
      - packaging/examples/agent.yaml
      - packaging/examples/bridge_agents.yaml
      - packaging/windows/install_service.ps1
      - packaging/windows/uninstall_service.ps1

  - id: archives-gui-linux
    ids:
      - agent-gui-linux
    name_template: "{{ .ProjectName }}-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

  - id: archives-gui-darwin
    ids:
      - agent-gui-darwin
    name_template: "{{ .ProjectName }}-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - packaging/launchd/com.dis.agent.plist

  - id: archives-gui-windows
    ids:
      - agent-gui-windows
    name_template: "{{ .ProjectName }}-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: linux
    package_name: dis-agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    maintainer: "DIS Reader Team <maintainer@example.com>"
    description: "DIS remote bridge agent (AS/400 JDBC bridge helper)."
    homepage: "https://github.com/BeardedWonderDev/DIS-Reader"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: packaging/examples/agent.yaml
        dst: /etc/dis-agent/agent.yaml
        type: config|noreplace
      - src: packaging/examples/bridge_agents.yaml
        dst: /etc/dis-agent/bridge_agents.yaml
        type: config|noreplace
      - src: packaging/systemd/dis-agent.service
        dst: /lib/systemd/system/dis-agent.service
        type: config|noreplace

homebrew_casks:
  - name: dis-agent
    ids:
      - archives-darwin
    url:
      template: "https://github.com/BeardedWonderDev/DIS-Reader/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/BeardedWonderDev/DIS-Reader"
    description: "DIS remote bridge agent (headless)."
    license: "Apache-2.0"
    binaries:
      - dis-agent
    repository:
      owner: BeardedWonderDev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    skip_upload: true

dockers_v2:
  - id: dis-agent
    images:
      - ghcr.io/beardedwonderdev/dis-agent
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: packaging/docker/Dockerfile

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  replace_existing_draft: true
  prerelease: auto
  mode: replace

changelog:
  use: github
  ai:
    use: openai
    model: gpt-4o-mini
    prompt: |
      Write the release notes for this release.

      ## Instructions:

      - Do not use emojis.
      - Write a short summary featuring user-impacting changes.
      - Follow Keep a Changelog 1.1.0 conventions. All relevant rules are embedded here so no external lookup is required.
      - Write release notes for humans, not machines. Curate and summarize; do not dump a raw git log.
      - Start with a top-level heading for this version in Keep a Changelog style:

        ## [{{ if eq .Tag "" }}to-be-defined{{ else }}{{ .Tag }}{{ end }}] - YYYY-MM-DD

        (Use the actual release date if available; otherwise omit the date.)

      ### Keep a Changelog Principles (Embedded):
      - Changelogs must be human-readable and focused on what changed and why.
      - Each release must have a heading in this style:
        ## [VERSION] - YYYY-MM-DD
        (If a date is not available, omit the date.)
      - After the heading, include a concise summary of the overall impact of the release.
      - Group entries under these exact categories (include only those containing entries):
          ### Added - new features.
          ### Changed - changes in existing functionality.
          ### Deprecated - features soon to be removed.
          ### Removed  features removed in this release.
          ### Fixed - bug fixes.
          ### Security - vulnerability-related changes.
      - Each bullet point should describe the change in clear, user-facing language.
      - Commit messages must remain unchanged; do not paraphrase them.
      - Related commits should be grouped together into a single bullet when appropriate.
      - If multiple commits update the same dependency, group them and show old and new versions:
          sha1, sha2: updated dependency-x from vA.B.C to vX.Y.Z.
      - The release notes should be formatted as Markdown.
      - Respond ONLY with the generated release notes—no explanations or commentary.

      - Provide a commit history and overview of each commit or related commit group under the appropriate category.

      ## Some details about this release:

      Project name: {{.ProjectName}}
      Git repository URL: {{.GitURL}}
      {{ if eq .Tag "" }}
      Previous version: {{.Version}}
      Version: to be defined
      {{ else }}
      Previous Version: {{.PreviousTag}}
      Version: {{.Tag}}
      {{ end }}
      {{ if .IsSnapshot }}This is a snapshot build.{{ end }}
      {{ if .IsNightly }}This is a nightly build.{{ end }}
      {{ with .TagSubject }}Tag subject: {{ . }}{{ end }}
      {{ with .TagContents }}Tag content: {{ . }}{{ end }}

      ## Release notes:

      {{ .ReleaseNotes }}
