name: dis-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: default
priority: extra
maintainer: DIS Reader
description: DIS Agent for remote JDBC bridge
homepage: https://github.com/BeardedWonderDev/DIS-Reader
license: MIT
contents:
  - src: ./dist/dis-agent-${GOOS}-${ARCH}/dis-agent
    dst: /usr/local/bin/dis-agent
    file_info:
      mode: 0755
  - src: ./packaging/examples/agent.yaml
    dst: /etc/dis-agent/agent.yaml
    type: config|noreplace
  - src: ./packaging/examples/bridge_agents.yaml
    dst: /etc/dis-agent/bridge_agents.yaml
    type: config|noreplace
  - src: ./packaging/systemd/dis-agent.service
    dst: /lib/systemd/system/dis-agent.service
overrides:
  rpm:
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      postremove: packaging/scripts/postremove.sh
  deb:
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      postremove: packaging/scripts/postremove.sh
